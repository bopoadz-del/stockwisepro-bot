services:
  - type: worker
    name: stockwisepro-bot
    runtime: docker
    plan: standard
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: STOCKWISE_API_BASE_URL
        value: https://stockwise-pro-api.onrender.com
      - key: STOCKWISE_API_KEY
        sync: false
      - key: BOT_ADMIN_TELEGRAM_IDS
        sync: false
      - key: DATA_DIR
        value: /app/data
      - key: ALERT_CHECK_INTERVAL_MINUTES
        value: 5
      - key: STOCKWISE_BOT_USER_EMAIL
        sync: false
      - key: STOCKWISE_BOT_USER_PASSWORD
        sync: false
      - key: BRAVE_API_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: WEB_CORS_ORIGINS
        sync: false
      - key: WEBSITE_URL
        value: https://stockwisepro-bot-pzi2.onrender.com
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: HEALTH_PORT
        value: 3000
      - key: DATABENTO_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_PAPER
        value: true
      - key: FMP_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
    disk:
      name: bot-data
      mountPath: /app/data
      sizeGB: 1
